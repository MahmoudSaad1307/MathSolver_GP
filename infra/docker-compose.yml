services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mathlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mathlens_dev_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-mathlens}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-mathlens} -d ${POSTGRES_DB:-mathlens}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin_change_me}
    volumes:
      - miniodata:/data
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - internal
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin_change_me};
      mc mb --ignore-existing local/${S3_BUCKET:-mathlens-answers};
      mc anonymous set none local/${S3_BUCKET:-mathlens-answers};
      exit 0;
      "

  ai:
    build:
      context: ..
      dockerfile: infra/Dockerfile.ai
    environment:
      AI_INTERNAL_KEY: ${AI_INTERNAL_KEY:-dev_internal_shared_secret_change_in_prod}
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      AI_MODEL_TRANSCRIBE: ${AI_MODEL_TRANSCRIBE:-claude-sonnet-4-20250514}
      AI_MODEL_GRADE: ${AI_MODEL_GRADE:-claude-sonnet-4-20250514}
      GROQ_VISION_MODEL: ${GROQ_VISION_MODEL:-meta-llama/llama-4-scout-17b-16e-instruct}
      GROQ_GRADE_MODEL: ${GROQ_GRADE_MODEL:-meta-llama/llama-4-scout-17b-16e-instruct}
      AI_MIN_CONFIDENCE: ${AI_MIN_CONFIDENCE:-0.75}
      AI_MAX_ILLEGIBLE_RATIO: ${AI_MAX_ILLEGIBLE_RATIO:-0.20}
      AI_PASS_GRADE_IMAGE: ${AI_PASS_GRADE_IMAGE:-true}
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8000/healthz']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-mathlens}:${POSTGRES_PASSWORD:-mathlens_dev_password_change_me}@postgres:5432/${POSTGRES_DB:-mathlens}?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-mathlens-answers}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin_change_me}
      S3_FORCE_PATH_STYLE: 'true'
      AI_SERVICE_URL: http://ai:8000
      AI_INTERNAL_KEY: ${AI_INTERNAL_KEY:-dev_internal_shared_secret_change_in_prod}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_access_secret_min_32_chars_change_in_prod}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_min_32_chars_change_in_prod}
      STUDENT_JWT_SECRET: ${STUDENT_JWT_SECRET:-dev_student_secret_min_32_chars_change_in_prod}
      VIDEO_UNLOCK_HMAC_SECRET: ${VIDEO_UNLOCK_HMAC_SECRET:-dev_unlock_secret_min_32_chars_change_in_prod}
      IP_HASH_SALT: ${IP_HASH_SALT:-dev_ip_salt_min_32_chars_change_in_prod}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      SEED_TEACHER_EMAIL: ${SEED_TEACHER_EMAIL:-teacher@mathlens.local}
      SEED_TEACHER_PASSWORD: ${SEED_TEACHER_PASSWORD:-TeacherPass123!}
      SEED_TEACHER_NAME: ${SEED_TEACHER_NAME:-أ. أحمد محمود}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      ai:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/healthz']
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    command: ['node', 'apps/api/dist/worker.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-mathlens}:${POSTGRES_PASSWORD:-mathlens_dev_password_change_me}@postgres:5432/${POSTGRES_DB:-mathlens}?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-mathlens-answers}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin_change_me}
      S3_FORCE_PATH_STYLE: 'true'
      AI_SERVICE_URL: http://ai:8000
      AI_INTERNAL_KEY: ${AI_INTERNAL_KEY:-dev_internal_shared_secret_change_in_prod}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_access_secret_min_32_chars_change_in_prod}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_min_32_chars_change_in_prod}
      STUDENT_JWT_SECRET: ${STUDENT_JWT_SECRET:-dev_student_secret_min_32_chars_change_in_prod}
      VIDEO_UNLOCK_HMAC_SECRET: ${VIDEO_UNLOCK_HMAC_SECRET:-dev_unlock_secret_min_32_chars_change_in_prod}
      IP_HASH_SALT: ${IP_HASH_SALT:-dev_ip_salt_min_32_chars_change_in_prod}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai:
        condition: service_healthy
    networks:
      - internal

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    ports:
      - '8080:8080'
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal
      - public
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/']
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  internal:
    internal: true
  public:

volumes:
  pgdata:
  redisdata:
  miniodata:
