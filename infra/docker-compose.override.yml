# Optional local development overrides exposing backing ports to localhost
services:
  postgres:
    ports:
      - '5435:5432'
  redis:
    ports:
      - '6379:6379'
  minio:
    ports:
      - '9000:9000'
      - '9001:9001'
  api:
    ports:
      - '4000:4000'

networks:
  internal:
    internal: false
